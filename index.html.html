<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>你的印象气味</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Noto+Serif+SC:wght@300;400;600&family=Noto+Sans+SC:wght@300;400&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --cream: #F7F1E8;
  --parchment: #EDE0C8;
  --amber: #C8934A;
  --amber-light: #E8B87A;
  --earth: #7A5832;
  --smoke: #9A8E7E;
  --ink: #2C2218;
  --white: #FDFAF4;
  --silver: #E8E4DE;
  --silver-bright: #F2EFE9;
}
body {
  background-color: var(--cream);
  color: var(--ink);
  font-family: 'Noto Sans SC', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    radial-gradient(ellipse at 15% 15%, rgba(200,147,74,0.09) 0%, transparent 55%),
    radial-gradient(ellipse at 85% 85%, rgba(90,107,74,0.07) 0%, transparent 55%);
  pointer-events: none;
  z-index: 0;
}
.container {
  position: relative;
  z-index: 1;
  max-width: 620px;
  margin: 0 auto;
  padding: 0 24px;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.page { display: none; }
.page.active { display: block; }
#page-loading.active { display: flex; }
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ===== 首页 ===== */
#page-start { text-align: center; padding: 70px 0; animation: fadeUp 0.9s ease both; }
.deco-line { width: 48px; height: 1px; background: var(–amber); margin: 0 auto 36px; }
.main-title {
font-family: ‘Noto Serif SC’, serif;
font-size: clamp(2rem, 9vw, 3.2rem);
font-weight: 600; color: var(–ink);
letter-spacing: 0.12em; line-height: 1.25; margin-bottom: 18px;
}
.main-title em { font-style: normal; color: var(–amber); }
.sub-title { font-size: 0.88rem; color: var(–smoke); font-weight: 300; letter-spacing: 0.28em; margin-bottom: 52px; }
.scent-bubbles { display: flex; justify-content: center; align-items: flex-end; gap: 12px; margin-bottom: 52px; height: 36px; }
.bubble { border-radius: 50%; animation: floatBubble 3s ease-in-out infinite; }
.bubble:nth-child(1) { width:10px;height:10px;background:#C8934A;animation-delay:0s; }
.bubble:nth-child(2) { width:16px;height:16px;background:#5A6B4A;animation-delay:0.4s; }
.bubble:nth-child(3) { width:22px;height:22px;background:#9B7040;animation-delay:0.8s; }
.bubble:nth-child(4) { width:14px;height:14px;background:#B07A8A;animation-delay:1.2s; }
.bubble:nth-child(5) { width:10px;height:10px;background:#6A507A;animation-delay:1.6s; }
@keyframes floatBubble {
0%,100% { transform: translateY(0); opacity:0.5; }
50% { transform: translateY(-10px); opacity:1; }
}
.intro-text { font-size: 0.88rem; color: var(–smoke); line-height: 2; max-width: 360px; margin: 0 auto 52px; font-weight: 300; }
.btn-start {
display: inline-block; padding: 16px 56px;
background: var(–ink); color: var(–cream);
font-family: ‘Noto Sans SC’, sans-serif; font-size: 0.88rem;
letter-spacing: 0.28em; border: none; cursor: pointer;
transition: background 0.3s, color 0.3s, letter-spacing 0.3s;
}
.btn-start:hover { background: var(–amber); color: var(–ink); letter-spacing: 0.35em; }
.start-meta { margin-top: 20px; font-size: 0.76rem; color: var(–smoke); letter-spacing: 0.15em; }

/* ===== 答题页 ===== */
#page-quiz { padding: 44px 0 60px; animation: fadeUp 0.5s ease both; }
.quiz-header { display: flex; align-items: center; gap: 20px; margin-bottom: 52px; }
.btn-back {
background: none; border: none; cursor: pointer; color: var(–smoke);
font-family: ‘Noto Sans SC’, sans-serif; font-size: 0.82rem;
letter-spacing: 0.1em; padding: 6px 0; transition: color 0.2s;
white-space: nowrap; display: flex; align-items: center; gap: 4px;
}
.btn-back:hover { color: var(–amber); }
.progress-wrap { flex: 1; }
/* 进度条只保留线条，不显示数字 */
.progress-bar-bg { height: 1px; background: var(–parchment); overflow: hidden; }
.progress-bar-fill { height: 100%; background: linear-gradient(90deg, var(–amber), var(–amber-light)); transition: width 0.45s ease; }
.q-number { font-family: ‘Playfair Display’, serif; font-style: italic; font-size: 0.8rem; color: var(–amber); letter-spacing: 0.2em; margin-bottom: 22px; }
/* 题目文字改为银白色 */
.q-text {
font-family: ‘Noto Serif SC’, serif;
font-size: clamp(1.05rem, 4vw, 1.35rem);
font-weight: 400;
color: #C8C0B4;
line-height: 1.85;
margin-bottom: 40px;
}
.options-list { list-style: none; display: flex; flex-direction: column; gap: 12px; }
.option-item {
border: 1px solid rgba(200,147,74,0.2); background: var(–white);
padding: 17px 22px; cursor: pointer;
transition: border-color 0.22s, padding-left 0.22s, background 0.22s, color 0.22s;
font-size: 0.88rem; color: #B8AFA4; font-weight: 300;
letter-spacing: 0.04em; line-height: 1.65; position: relative;
}
.option-item::after {
content: ‘’; position: absolute; left: 0; top: 0; bottom: 0;
width: 0; background: var(–amber); transition: width 0.22s ease;
}
.option-item:hover { border-color: var(–amber); padding-left: 28px; color: var(–amber-light); }
.option-item:hover::after { width: 3px; }
.option-item.selected { border-color: var(–amber); background: rgba(200,147,74,0.05); padding-left: 28px; color: var(–amber-light); }
.option-item.selected::after { width: 3px; }
.quiz-footer { margin-top: 36px; display: flex; justify-content: flex-end; }
.btn-next {
padding: 14px 42px; background: var(–ink); color: rgba(253,250,244,0.3);
border: none; cursor: default; font-family: ‘Noto Sans SC’, sans-serif;
font-size: 0.84rem; letter-spacing: 0.2em;
transition: background 0.25s, color 0.25s, letter-spacing 0.25s;
}
.btn-next.active { color: var(–cream); cursor: pointer; }
.btn-next.active:hover { background: var(–amber); color: var(–ink); letter-spacing: 0.25em; }

/* ===== 加载页 ===== */
#page-loading { flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 28px; }
.loading-ring { width: 44px; height: 44px; border: 1px solid var(–parchment); border-top-color: var(–amber); border-radius: 50%; animation: spin 1.2s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { font-size: 0.82rem; color: var(–smoke); letter-spacing: 0.25em; }

/* ===== 结果页 ===== */
#page-result { padding: 56px 0 88px; animation: fadeUp 0.8s ease both; }
.result-header { text-align: center; margin-bottom: 44px; }
.result-eyebrow { font-size: 0.74rem; letter-spacing: 0.32em; color: var(–smoke); margin-bottom: 18px; }
.result-scent-name {
font-family: ‘Noto Serif SC’, serif;
font-size: clamp(2rem, 8vw, 2.8rem);
font-weight: 600; color: var(–amber);
letter-spacing: 0.12em; margin-bottom: 12px; line-height: 1.2;
}
.result-scent-en { font-family: ‘Playfair Display’, serif; font-style: italic; font-size: 1rem; color: var(–smoke); letter-spacing: 0.1em; }
.divider { width: 36px; height: 1px; background: var(–amber); margin: 32px auto; }
.chart-section { background: var(–white); border: 1px solid rgba(200,147,74,0.2); padding: 28px 24px; margin-bottom: 20px; }
.section-label { font-size: 0.72rem; letter-spacing: 0.28em; color: var(–smoke); margin-bottom: 28px; }
.bar-item { margin-bottom: 18px; }
.bar-item:last-child { margin-bottom: 0; }
.bar-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.bar-label { font-size: 0.84rem; color: #9A8E7E; }
.bar-pct { font-family: ‘Playfair Display’, serif; font-size: 0.88rem; color: var(–amber); }
.bar-track { height: 5px; background: var(–parchment); border-radius: 3px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 3px; width: 0; transition: width 1.3s cubic-bezier(0.16, 1, 0.3, 1); }
.result-card { background: var(–white); border: 1px solid rgba(200,147,74,0.2); padding: 28px 24px; margin-bottom: 16px; }
.card-label { font-size: 0.72rem; letter-spacing: 0.28em; color: var(–amber); margin-bottom: 16px; }
/* 结果描述文字改为暖银色 */
.card-text { font-size: 0.88rem; line-height: 2; color: #A89E92; font-weight: 300; }
.attract-wrap { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.attract-tag { padding: 8px 18px; background: rgba(200,147,74,0.08); border: 1px solid rgba(200,147,74,0.3); font-size: 0.84rem; color: var(–amber); letter-spacing: 0.08em; }
.attract-sym { font-size: 1.1rem; color: var(–amber); font-weight: 300; }
.btn-restart {
display: block; width: 100%; margin-top: 32px; padding: 16px;
background: none; border: 1px solid rgba(200,147,74,0.4); color: var(–smoke);
font-family: ‘Noto Sans SC’, sans-serif; font-size: 0.84rem;
letter-spacing: 0.28em; cursor: pointer; transition: all 0.25s;
}
.btn-restart:hover { background: var(–ink); color: var(–cream); border-color: var(–ink); }

/* 融合标签 */
.blend-tags { display: flex; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }
.blend-tag {
padding: 5px 14px;
border-radius: 0;
font-size: 0.76rem;
letter-spacing: 0.15em;
border: 1px solid;
}
</style>

</head>
<body>
<div class="container">

<!-- 首页 -->

<div id="page-start" class="page active">
  <div class="deco-line"></div>
  <h1 class="main-title">你的<em>印象</em>气味</h1>
  <p class="sub-title">属于你的气味是怎样的？</p>
  <div class="scent-bubbles">
    <div class="bubble"></div><div class="bubble"></div><div class="bubble"></div>
    <div class="bubble"></div><div class="bubble"></div>
  </div>
  <p class="intro-text">每个人都有独特的气味印象。<br>通过 20 道直觉题，发现你散发给他人的气味性格——那是比语言更诚实的信息。</p>
  <button class="btn-start" onclick="startQuiz()">开 始 测 试</button>
  <p class="start-meta">共 20 题 · 约 3 分钟</p>
</div>

<!-- 答题页 -->

<div id="page-quiz" class="page">
  <div class="quiz-header">
    <button class="btn-back" id="btn-back" onclick="goBack()">&#8592; 上一题</button>
    <div class="progress-wrap">
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progress-fill" style="width:5%"></div>
      </div>
    </div>
  </div>
  <div class="q-number" id="q-number">Q 01</div>
  <div class="q-text" id="q-text"></div>
  <ul class="options-list" id="options-list"></ul>
  <div class="quiz-footer">
    <button class="btn-next" id="btn-next" onclick="goNext()">下一题</button>
  </div>
</div>

<!-- 加载页 -->

<div id="page-loading" class="page">
  <div class="loading-ring"></div>
  <div class="loading-text">正在分析你的气味印象…</div>
</div>

<!-- 结果页 -->

<div id="page-result" class="page">
  <div class="result-header">
    <div class="result-eyebrow">你的印象气味是</div>
    <div class="result-scent-name" id="r-name"></div>
    <div class="result-scent-en" id="r-en"></div>
  </div>
  <div class="divider"></div>
  <div class="chart-section">
    <div class="section-label">气味维度分析</div>
    <div id="bars"></div>
  </div>
  <div class="result-card">
    <div class="card-label">气味解读</div>
    <div class="blend-tags" id="blend-tags"></div>
    <div class="card-text" id="r-desc"></div>
  </div>
  <div class="result-card">
    <div class="card-label">与你相互吸引的气味</div>
    <div class="attract-wrap" id="r-attract"></div>
  </div>
  <button class="btn-restart" onclick="restart()">重 新 测 试</button>
</div>

</div>

<script>
var questions = [
  {
    text: '周末突然有一整天的空闲，你最可能做什么？',
    options: [
      { text: '一个人待在家，读书或看电影', s: { woody:2, fresh:0, floral:0, warm:1, dark:1 } },
      { text: '约朋友出去，随便逛逛', s: { woody:0, fresh:2, floral:1, warm:1, dark:0 } },
      { text: '策划一件有意思的事情去做', s: { woody:0, fresh:1, floral:0, warm:0, dark:2 } },
      { text: '睡懒觉，什么都不计划', s: { woody:1, fresh:0, floral:2, warm:1, dark:0 } }
    ]
  },
  {
    text: '朋友向你倾诉烦恼，你通常会怎么做？',
    options: [
      { text: '静静听完，给出理性建议', s: { woody:2, fresh:1, floral:0, warm:0, dark:1 } },
      { text: '先让对方感受到被理解，情绪为主', s: { woody:0, fresh:0, floral:2, warm:2, dark:0 } },
      { text: '帮他们一起分析，找解决方案', s: { woody:1, fresh:2, floral:0, warm:0, dark:1 } },
      { text: '陪着对方，不一定说话', s: { woody:1, fresh:0, floral:1, warm:2, dark:1 } }
    ]
  },
  {
    text: '如果你是一种天气，你更像哪一种？',
    options: [
      { text: '初春薄雾的清晨', s: { woody:1, fresh:2, floral:1, warm:0, dark:0 } },
      { text: '夏末黄昏的微风', s: { woody:0, fresh:1, floral:2, warm:1, dark:0 } },
      { text: '深秋落叶的傍晚', s: { woody:2, fresh:0, floral:0, warm:1, dark:1 } },
      { text: '冬夜寂静的大雪', s: { woody:1, fresh:0, floral:0, warm:0, dark:2 } }
    ]
  },
  {
    text: '在一个陌生的聚会上，你更倾向于？',
    options: [
      { text: '找一个安静角落，等待有缘分的人来聊', s: { woody:2, fresh:0, floral:0, warm:0, dark:2 } },
      { text: '主动去认识有趣的人', s: { woody:0, fresh:2, floral:1, warm:1, dark:0 } },
      { text: '跟着朋友走，不想单独行动', s: { woody:0, fresh:1, floral:2, warm:2, dark:0 } },
      { text: '观察所有人，心里悄悄给他们贴标签', s: { woody:1, fresh:0, floral:0, warm:0, dark:3 } }
    ]
  },
  {
    text: '你觉得自己最打动人的特质是？',
    options: [
      { text: '可靠，说到做到', s: { woody:2, fresh:1, floral:0, warm:1, dark:0 } },
      { text: '温暖，让人感到舒服', s: { woody:0, fresh:0, floral:1, warm:2, dark:0 } },
      { text: '有趣，总有新奇的想法', s: { woody:0, fresh:2, floral:0, warm:0, dark:1 } },
      { text: '神秘，让人想要了解更多', s: { woody:1, fresh:0, floral:0, warm:0, dark:3 } }
    ]
  },
  {
    text: '哪种颜色最接近你内心深处的感觉？',
    options: [
      { text: '米白或浅米黄', s: { woody:1, fresh:1, floral:2, warm:1, dark:0 } },
      { text: '深蓝或墨绿', s: { woody:2, fresh:1, floral:0, warm:0, dark:1 } },
      { text: '橙红或暖棕', s: { woody:1, fresh:0, floral:0, warm:2, dark:1 } },
      { text: '黑色或深紫', s: { woody:0, fresh:0, floral:0, warm:0, dark:3 } }
    ]
  },
  {
    text: '你最喜欢哪种独处的方式？',
    options: [
      { text: '睡前一个人静静地看书或刷手机', s: { woody:2, fresh:0, floral:0, warm:1, dark:1 } },
      { text: '早晨喝咖啡，随意听音乐或播客', s: { woody:0, fresh:2, floral:1, warm:1, dark:0 } },
      { text: '漫无目的地散步', s: { woody:1, fresh:1, floral:0, warm:0, dark:1 } },
      { text: '什么都不做，发呆', s: { woody:1, fresh:0, floral:1, warm:1, dark:2 } }
    ]
  },
  {
    text: '面对一个重要决定，你通常怎么做？',
    options: [
      { text: '仔细分析利弊，再做选择', s: { woody:2, fresh:1, floral:0, warm:0, dark:1 } },
      { text: '相信直觉，快速决定', s: { woody:0, fresh:1, floral:1, warm:1, dark:1 } },
      { text: '询问周围人的意见，综合考虑', s: { woody:0, fresh:1, floral:2, warm:2, dark:0 } },
      { text: '先拖一拖，等感觉来了再说', s: { woody:1, fresh:0, floral:0, warm:1, dark:2 } }
    ]
  },
  {
    text: '当你一个人待着的时候，你的状态是？',
    options: [
      { text: '充电，感到平静和满足', s: { woody:2, fresh:0, floral:0, warm:1, dark:1 } },
      { text: '容易感到无聊或孤单', s: { woody:0, fresh:1, floral:2, warm:2, dark:0 } },
      { text: '思绪飞转，脑子停不下来', s: { woody:1, fresh:1, floral:0, warm:0, dark:2 } },
      { text: '随心所欲，时而精力满满时而发呆', s: { woody:0, fresh:2, floral:1, warm:1, dark:0 } }
    ]
  },
  {
    text: '你觉得哪句话最像你？',
    options: [
      { text: '我喜欢细水长流，不喜欢轰轰烈烈', s: { woody:2, fresh:0, floral:1, warm:1, dark:0 } },
      { text: '我随时准备出发，去陌生的地方', s: { woody:0, fresh:2, floral:0, warm:0, dark:1 } },
      { text: '我想被人好好珍惜和理解', s: { woody:0, fresh:0, floral:2, warm:2, dark:0 } },
      { text: '我比别人看到的更深一点', s: { woody:1, fresh:0, floral:0, warm:0, dark:3 } }
    ]
  },
  {
    text: '如果你可以选择居住的地方，你会选？',
    options: [
      { text: '安静的山间小屋', s: { woody:3, fresh:0, floral:0, warm:0, dark:1 } },
      { text: '海边或湖边的住所', s: { woody:0, fresh:2, floral:1, warm:1, dark:0 } },
      { text: '热闹城市里的公寓', s: { woody:0, fresh:1, floral:1, warm:2, dark:0 } },
      { text: '老城区充满故事感的旧建筑', s: { woody:1, fresh:0, floral:0, warm:0, dark:3 } }
    ]
  },
  {
    text: '你在人群中给别人的第一印象通常是？',
    options: [
      { text: '沉稳、可信赖', s: { woody:2, fresh:0, floral:0, warm:1, dark:1 } },
      { text: '活泼、好相处', s: { woody:0, fresh:2, floral:1, warm:2, dark:0 } },
      { text: '温柔、好说话', s: { woody:0, fresh:0, floral:2, warm:2, dark:0 } },
      { text: '难以捉摸、有距离感', s: { woody:1, fresh:0, floral:0, warm:0, dark:3 } }
    ]
  },
  {
    text: '对你而言，理想的亲密关系是？',
    options: [
      { text: '相互独立，又彼此陪伴', s: { woody:2, fresh:1, floral:0, warm:0, dark:1 } },
      { text: '随时都能说笑、一起冒险', s: { woody:0, fresh:2, floral:0, warm:1, dark:0 } },
      { text: '深深懂得彼此，不需要解释', s: { woody:1, fresh:0, floral:1, warm:1, dark:2 } },
      { text: '温馨日常，有人陪着就好', s: { woody:0, fresh:0, floral:2, warm:3, dark:0 } }
    ]
  },
  {
    text: '当你情绪低落时，你通常会？',
    options: [
      { text: '一个人消化，不想麻烦别人', s: { woody:2, fresh:0, floral:0, warm:0, dark:2 } },
      { text: '找朋友聊聊，倾诉一番', s: { woody:0, fresh:1, floral:2, warm:2, dark:0 } },
      { text: '去运动或做一件喜欢的事', s: { woody:1, fresh:2, floral:0, warm:1, dark:0 } },
      { text: '让情绪自然流淌，等它过去', s: { woody:1, fresh:0, floral:0, warm:0, dark:2 } }
    ]
  },
  {
    text: '你怎么看待改变这件事？',

var labelMap = { woody:'沉木香', fresh:'清绿香', floral:'馥郁樱香', warm:'琥珀暖香', dark:'暗夜沉香' };
var colorMap = { woody:'#9B7040', fresh:'#6B8A56', floral:'#B07A8A', warm:'#C8934A', dark:'#6A507A' };

var curIdx = 0;
var answers = [];

function showPage(id) {
  var all = document.querySelectorAll('.page');
  for (var i = 0; i < all.length; i++) all[i].classList.remove('active');
  document.getElementById(id).classList.add('active');
}

function startQuiz() {
  curIdx = 0;
  answers = [];
  for (var i = 0; i < questions.length; i++) answers.push(-1);
  showPage('page-quiz');
  render();
}

function render() {
  var q = questions[curIdx];
  var total = questions.length;
  var n = curIdx + 1;
  document.getElementById('progress-fill').style.width = (n / total * 100) + '%';
  document.getElementById('q-number').textContent = 'Q ' + (n < 10 ? '0' + n : '' + n);
  document.getElementById('q-text').textContent = q.text;
  var list = document.getElementById('options-list');
  list.innerHTML = '';
  for (var i = 0; i < q.options.length; i++) {
    var li = document.createElement('li');
    li.className = 'option-item' + (answers[curIdx] === i ? ' selected' : '');
    li.textContent = q.options[i].text;
    (function(idx) { li.onclick = function() { pick(idx); }; })(i);
    list.appendChild(li);
  }
  var btn = document.getElementById('btn-next');
  btn.textContent = (curIdx === questions.length - 1) ? '查看结果' : '下一题';
  btn.className = 'btn-next' + (answers[curIdx] !== -1 ? ' active' : '');
  document.getElementById('btn-back').style.visibility = curIdx === 0 ? 'hidden' : 'visible';
}

function pick(i) {
  answers[curIdx] = i;
  var items = document.querySelectorAll('.option-item');
  for (var j = 0; j < items.length; j++) {
    items[j].className = 'option-item' + (j === i ? ' selected' : '');
  }
  document.getElementById('btn-next').className = 'btn-next active';
}

function goBack() {
  if (curIdx > 0) { curIdx--; render(); }
}

function goNext() {
  if (answers[curIdx] === -1) return;
  if (curIdx < questions.length - 1) { curIdx++; render(); }
  else calcResult();
}

function calcResult() {
  showPage('page-loading');
  setTimeout(function() {
    var sc = { woody:0, fresh:0, floral:0, warm:0, dark:0 };
    for (var i = 0; i < questions.length; i++) {
      var ai = answers[i];
      if (ai === -1) continue;
      var s = questions[i].options[ai].s;
      var ks = Object.keys(s);
      for (var k = 0; k < ks.length; k++) sc[ks[k]] += s[ks[k]];
    }
    // 排序找出第一、第二高
    var sorted = Object.keys(sc).sort(function(a,b){ return sc[b]-sc[a]; });
    var first = sorted[0];
    var second = sorted[1];
    buildResult(first, second, sc);
    showPage('page-result');
  }, 1800);
}

function buildResult(first, second, sc) {
  var t1 = scentFragments[first];
  var t2 = scentFragments[second];

  // 标题
  document.getElementById('r-name').textContent = t1.name;
  document.getElementById('r-en').textContent = t1.en + '  ·  ' + t2.en;

  // 融合标签
  var tagsEl = document.getElementById('blend-tags');
  tagsEl.innerHTML = '';
  var tag1 = document.createElement('span');
  tag1.className = 'blend-tag';
  tag1.textContent = t1.name;
  tag1.style.background = t1.tagBg;
  tag1.style.borderColor = t1.tagBorder;
  tag1.style.color = t1.color;
  tagsEl.appendChild(tag1);
  var tag2 = document.createElement('span');
  tag2.className = 'blend-tag';
  tag2.textContent = t2.name;
  tag2.style.background = t2.tagBg;
  tag2.style.borderColor = t2.tagBorder;
  tag2.style.color = t2.color;
  tagsEl.appendChild(tag2);

  // 融合解读文字
  var blendKey = first + '+' + second;
  var desc = blendDesc[blendKey];
  if (!desc) {
    // 兜底：拼接两段
    desc = t1.core + t1.texture + '\n\n' + t2.core + t2.impression;
  }
  document.getElementById('r-desc').textContent = desc;

  // 吸引配对（用第一气味的吸引对象）
  var aw = document.getElementById('r-attract');
  aw.innerHTML = '';
  var myTag = document.createElement('span');
  myTag.className = 'attract-tag';
  myTag.textContent = t1.name;
  aw.appendChild(myTag);
  var sym = document.createElement('span');
  sym.className = 'attract-sym';
  sym.textContent = ' ⇌ ';
  aw.appendChild(sym);
  for (var i = 0; i < t1.attract.length; i++) {
    var atag = document.createElement('span');
    atag.className = 'attract-tag';
    atag.textContent = t1.attract[i];
    aw.appendChild(atag);
    if (i < t1.attract.length - 1) {
      var dot = document.createElement('span');
      dot.style.color = '#9A8E7E';
      dot.style.margin = '0 4px';
      dot.textContent = '·';
      aw.appendChild(dot);
    }
  }

  // 条形图
  var total = 0;
  var ks = Object.keys(sc);
  for (var j = 0; j < ks.length; j++) total += sc[ks[j]];
  var sortedBars = ks.slice().sort(function(a,b){ return sc[b]-sc[a]; });
  var bars = document.getElementById('bars');
  bars.innerHTML = '';
  for (var n = 0; n < sortedBars.length; n++) {
    var k = sortedBars[n];
    var pct = total > 0 ? Math.round(sc[k] / total * 100) : 0;
    var div = document.createElement('div');
    div.className = 'bar-item';
    div.innerHTML =
      '<div class="bar-top"><span class="bar-label">' + labelMap[k] + '</span><span class="bar-pct">' + pct + '%</span></div>' +
      '<div class="bar-track"><div class="bar-fill" data-pct="' + pct + '" style="background:' + colorMap[k] + '"></div></div>';
    bars.appendChild(div);
  }
  setTimeout(function() {
    var fills = document.querySelectorAll('.bar-fill');
    for (var f = 0; f < fills.length; f++) {
      fills[f].style.width = fills[f].getAttribute('data-pct') + '%';
    }
  }, 200);
}

function restart() { showPage('page-start'); }
